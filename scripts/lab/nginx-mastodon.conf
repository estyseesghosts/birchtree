# Lab-only TLS terminator for Mastodon (production builds force SSL and build https URLs).
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /certs/mastodon.lab.crt;
    ssl_certificate_key /certs/mastodon.lab.key;
    client_max_body_size 40m;
    location / {
      proxy_pass http://172.28.0.11:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}

# Lab-only TLS terminator for birchtree (runs on the host at 172.28.0.1:8080).
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 443 ssl;
    ssl_certificate /certs/birchtree.lab.crt;
    ssl_certificate_key /certs/birchtree.lab.key;
    client_max_body_size 2m;
    location / {
      proxy_pass http://172.28.0.1:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}

[package]
name = "birchtree"
license = "AGPL-3.0"
version = "0.1.0"
edition = "2024"

[profile.test]
opt-level = 1

[dependencies]
redb = "4.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
rand = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
zeroize = "1"
axum = { version = "0.7", features = ["multipart", "ws"] }
http-body-util = "0.1"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
spki = { version = "0.7", features = ["pem"] }
base64 = "0.23"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
ring = "0.17"
thiserror = "2.0"
futures-util = "0.3"
# Media processing (Phase 4): decode/encode uploads and blurhash previews.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
blurhash = "0.1"
# Federation (Phase 6): the outbound HTTP client (`federation::net`) and URL parsing.
# Proxies are disabled and redirects are refused by reqwest; the crate follows one.
reqwest = { version = "0.12", default-features = true, features = ["json"] }
url = "2"
# Federation (Phase 6): ActivityPub protocol (HTTP signatures, inbox, WebFinger, delivery).
# Pinned to the 0.6.6 line, which needs axum 0.7 (`axum` feature). AGPL-3.0; accepted by the owner.
activitypub_federation = { version = "=0.6.6", default-features = false, features = ["axum"] }
async-trait = "0.1"
enum_delegate = "0.2"
reqwest-middleware = "0.3.2"
anyhow = "1"
http = "1"

[dev-dependencies]
futures-core = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Birchtree patch: the inbox accepts 1 MB (see vendor/README.md). Everything else is the crate, unmodified.
[patch.crates-io]
activitypub_federation = { path = "vendor/activitypub_federation" }

[package]
name = "birchtree"
version = "0.1.0"
edition = "2024"

[profile.test]
opt-level = 1

[dependencies]
redb = "4.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
rand = "0.10.3"
axum = { version = "0.8", features = ["multipart", "ws"] }
http-body-util = "0.1"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
spki = { version = "0.7", features = ["pem"] }
base64 = "0.23"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
ring = "0.17"
thiserror = "2.0"
futures-util = "0.3"

[dev-dependencies]
futures-core = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
